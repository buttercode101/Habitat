[project]
name = "habitat"
version = "1.0.0"
description = "A minimal, self-observing home for autonomous agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
habitat = "habitat.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["habitat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
