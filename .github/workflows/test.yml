name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install Habitat
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q habitat tools
      - name: Run core tests
        run: python -m pytest -q
      - name: Smoke prove_run example
        run: python examples/prove_run.py
      - name: Install signing extra
        run: python -m pip install -e '.[signing]'
      - name: Run signing and trust tests
        run: python -m pytest -q tests/test_proof_sign.py tests/test_trust.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[signing]' pytest pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit --local
