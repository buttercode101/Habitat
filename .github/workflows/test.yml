name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install Habitat
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q habitat tools
      - name: Run core tests
        run: python -m pytest -q
      - name: Smoke prove_run example
        run: python examples/prove_run.py
      - name: Install signing extra
        run: python -m pip install -e '.[signing]'
      - name: Run signing and trust tests
        run: python -m pytest -q tests/test_proof_sign.py tests/test_trust.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[signing]' pytest pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit --local

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d682002e1 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --ignore-scripts
      - name: Build web application
        working-directory: web
        run: npm run build
      - name: Check web diff hygiene
        run: git diff --check
