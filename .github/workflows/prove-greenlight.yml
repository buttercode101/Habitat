name: Prove real Greenlight change

on:
  push:
    paths:
      - .github/workflows/prove-greenlight.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Habitat
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Habitat
        run: python -m pip install .

      - name: Record the real Greenlight commit in a fresh Habitat ledger
        env:
          GREENLIGHT_SHA: 9dc5a007169689babe122ccfe673faa8b03c08c4
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from habitat.schema import Action, Habitat
          from habitat.store import Store

          sha = os.environ["GREENLIGHT_SHA"]
          db = Path(".habitat/real-greenlight.db")
          store = Store(db)
          now = datetime.now(timezone.utc)
          store.save_habitat(Habitat("real-greenlight", "Real Greenlight evidence", "github-actions", now, now))
          store.save_action(Action(
              id=f"greenlight-commit-{sha[:12]}",
              habitat_id="real-greenlight",
              timestamp=now,
              actor="system",
              action="commit",
              status="ok",
              details={
                  "repo": "buttercode101/Greenlight-k53",
                  "commit": sha,
                  "url": f"https://github.com/buttercode101/Greenlight-k53/commit/{sha}",
                  "summary": "Refresh K53 database cache when online while retaining offline fallback.",
              },
              run_id=sha,
          ))
          store.close()
          PY

      - name: Prove the real Greenlight change
        run: |
          mkdir -p proofs
          python -m habitat --db .habitat/real-greenlight.db prove \
            --run-id "9dc5a007169689babe122ccfe673faa8b03c08c4" \
            --claim "Shipped Greenlight-k53 change: refresh the K53 database cache when online while retaining offline fallback." \
            --action commit \
            -o "proofs/greenlight-9dc5a007.json" \
            --card

      - name: Persist the portable proof in Habitat
        run: |
          rm -f .habitat/real-greenlight.db proofs/greenlight-9dc5a007.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proofs/greenlight-9dc5a007.json
          git commit -m "proof: verify real Greenlight change"
          git push
