name: tip-and-verify

# Verify checked-in Habitat proofs and optional proof tip files.
on:
  push:
    paths:
      - "proofs/**"
      - "tools/verify_proof.py"
      - "tools/verify_tip.py"
      - ".github/workflows/tip-and-verify.yml"
  pull_request:
    paths:
      - "proofs/**"
      - "tools/verify_proof.py"
      - "tools/verify_tip.py"
      - ".github/workflows/tip-and-verify.yml"
  workflow_dispatch:
    inputs:
      proof_path:
        description: "Path to proof.json (default: all under proofs/)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify proofs and optional tip files
        env:
          PROOF_PATH: ${{ inputs.proof_path }}
        run: |
          set -euo pipefail
          if [ -n "$PROOF_PATH" ]; then
            FILES=("$PROOF_PATH")
          else
            mapfile -t FILES < <(find proofs -name '*.json' -type f | sort)
          fi

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No proof files found; nothing to verify."
            exit 0
          fi

          fail=0
          for f in "${FILES[@]}"; do
            echo "::group::verify $f"
            if ! python tools/verify_proof.py "$f"; then
              fail=1
            fi

            tip="${f%.json}.tip.json"
            base=$(basename "$f" .json)
            dir=$(dirname "$f")
            alt="$dir/tip-${base#*-}.json"

            for t in "$tip" "$alt"; do
              if [ -f "$t" ]; then
                echo "Checking tip file $t"
                if ! python tools/verify_tip.py "$f" "$t"; then
                  fail=1
                fi
              fi
            done
            echo "::endgroup::"
          done

          exit "$fail"
