name: tip-and-verify

# Optional CI path: verify a checked-in proof and, when present, its tip file.
# Does not require Habitat installed as a package — uses tools/verify_proof.py
# and a tiny tip check that only needs the stdlib.

on:
  push:
    paths:
      - "proofs/**"
      - "tools/verify_proof.py"
      - ".github/workflows/tip-and-verify.yml"
  pull_request:
    paths:
      - "proofs/**"
  workflow_dispatch:
    inputs:
      proof_path:
        description: "Path to proof.json (default: all under proofs/)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify proofs (and optional tip files)
        run: |
          set -euo pipefail
          PROOFS="${{ github.event.inputs.proof_path }}"
          if [ -z "$PROOFS" ]; then
            mapfile -t FILES < <(find proofs -name '*.json' -type f | sort)
          else
            FILES=("$PROOFS")
          fi
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No proof files found; nothing to verify."
            exit 0
          fi
          fail=0
          for f in "${FILES[@]}"; do
            echo "::group::verify $f"
            python tools/verify_proof.py "$f" || fail=1
            tip="${f%.json}.tip.json"
            # also accept tip-<id>.json next to proof
            base=$(basename "$f" .json)
            dir=$(dirname "$f")
            alt="$dir/tip-${base#*-}.json"
            for t in "$tip" "$alt"; do
              if [ -f "$t" ]; then
                echo "Checking tip file $t"
                python - << PY
import json, sys
proof = json.load(open("$f"))
tip = json.load(open("$t"))
expected = tip.get("tip")
actual = proof.get("content_sha256")
if not expected or expected != actual:
    print(f"TIP MISMATCH: expected={expected!r} actual={actual!r}")
    sys.exit(1)
print("TIP OK")
PY
                || fail=1
              fi
            done
            echo "::endgroup::"
          done
          exit $fail
