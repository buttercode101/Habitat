name: Verify Habitat proof

on:
  workflow_dispatch:
    inputs:
      proof:
        description: Path to a Habitat proof JSON bundle
        required: true
        default: proof.json
  push:
    paths:
      - 'proof.json'
      - 'proofs/**/*.json'
      - 'tools/verify_proof.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select proof
        id: proof
        shell: bash
        env:
          PROOF_INPUT: ${{ github.event.inputs.proof }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          proof="${PROOF_INPUT:-proof.json}"
          if [[ -z "$proof" || "$proof" == /* || "$proof" == *$'\n'* || "$proof" == *$'\r'* || "$proof" == *$'\0'* ]]; then
            echo "Invalid proof path" >&2
            exit 1
          fi
          if [[ "$proof" != *.json || "$proof" == *..* ]]; then
            echo "Proof path must be a relative .json path without '..'" >&2
            exit 1
          fi
          if [[ ! -f "$proof" ]]; then
            if [[ "$EVENT_NAME" == "push" ]]; then
              echo "No proof bundle present; nothing to verify on this push."
              printf 'skip=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Proof file not found: $proof" >&2
            exit 1
          fi
          printf 'path=%s\n' "$proof" >> "$GITHUB_OUTPUT"
          printf 'skip=false\n' >> "$GITHUB_OUTPUT"

      - name: Verify proof
        if: steps.proof.outputs.skip != 'true'
        shell: bash
        env:
          PROOF_PATH: ${{ steps.proof.outputs.path }}
        run: python tools/verify_proof.py "$PROOF_PATH"
