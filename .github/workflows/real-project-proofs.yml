name: Real project proofs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Habitat
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Habitat
        run: python -m pip install .

      - name: Generate and independently verify real project proofs
        run: |
          python - <<'PY'
          import json
          import uuid
          from datetime import datetime, timezone
          from pathlib import Path

          from habitat.claims import Claim
          from habitat.proof import build_proof
          from habitat.proof_card import render_proof_card
          from habitat.proof_verify import verify_proof
          from habitat.schema import Action, Habitat
          from habitat.store import Store
          from habitat.verify import verify_claim

          projects = [
              {
                  "key": "rosendaltown",
                  "repo": "buttercode101/rosendaltown",
                  "commit": "45bc7aa7f9458ced34c97cd76a7e833c71632aaa",
                  "summary": "Fix category image/content mismatch by mapping real Rosendal photos to each listing and updating homepage/category imagery.",
                  "url": "https://github.com/buttercode101/rosendaltown/commit/45bc7aa7f9458ced34c97cd76a7e833c71632aaa",
                  "claim": "Shipped Rosendaltown change: corrected category image/content mapping and refreshed homepage imagery with the real Rosendal photos.",
              },
              {
                  "key": "solobid-v2",
                  "repo": "buttercode101/SoloBid-v2",
                  "commit": "5d5f169f93376fc1cb969fd72df44c3b5c1da246",
                  "summary": "Add invoice-native DueToday coverage and UI lanes.",
                  "url": "https://github.com/buttercode101/SoloBid-v2/commit/5d5f169f93376fc1cb969fd72df44c3b5c1da246",
                  "claim": "Shipped SoloBid-v2 change: added invoice-native DueToday coverage and UI lanes.",
              },
              {
                  "key": "diketo",
                  "repo": "buttercode101/Diketo",
                  "commit": "3e308dfce343e137a08b11d0810884d3d27f75d9",
                  "summary": "Add low-end performance soft limits.",
                  "url": "https://github.com/buttercode101/Diketo/commit/3e308dfce343e137a08b11d0810884d3d27f75d9",
                  "claim": "Shipped Diketo change: added low-end performance soft limits for the game.",
              },
          ]

          now = datetime.now(timezone.utc)
          db = Path("/tmp/habitat-real-proofs.db")
          store = Store(db)
          store.save_habitat(Habitat("real-projects", "Real Project Proofs"))

          out = Path("proofs")
          out.mkdir(exist_ok=True)

          for item in projects:
              action_id = f"{item['key']}-commit-{item['commit'][:12]}"
              run_id = item["commit"]
              action = Action(
                  id=action_id,
                  habitat_id="real-projects",
                  timestamp=now,
                  actor="github",
                  action="commit",
                  status="ok",
                  job_id=None,
                  details={
                      "repo": item["repo"],
                      "commit": item["commit"],
                      "summary": item["summary"],
                      "url": item["url"],
                      "source": "existing_real_project_commit",
                  },
                  run_id=run_id,
              )
              store.save_action(action)

              claim = Claim.new(
                  "real-projects",
                  item["claim"],
                  action="commit",
                  expected_status="ok",
              )
              claim.run_id = run_id
              store.save_claim(claim)

              verified = verify_claim(store, claim)
              if verified.status != "verified":
                  raise SystemExit(f"claim verification failed for {item['key']}: {verified.status}")

              proof = build_proof(store, verified.id)
              result = verify_proof(proof)
              if not result.get("valid"):
                  raise SystemExit(f"standalone proof verification failed for {item['key']}: {result}")

              proof_path = out / f"{item['key']}-{item['commit'][:8]}.json"
              card_path = out / f"{item['key']}-{item['commit'][:8]}.md"
              proof_path.write_text(json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              card_path.write_text(render_proof_card(proof, result), encoding="utf-8")
              print(f"VALID {item['key']}: {proof_path}")

          store.close()
          PY

      - name: Check generated proofs independently
        run: |
          for proof in proofs/rosendaltown-*.json proofs/solobid-v2-*.json proofs/diketo-*.json; do
            python tools/verify_proof.py "$proof"
          done

      - name: Commit the three real proofs
        run: |
          git config user.name "Habitat Proof Bot"
          git config user.email "habitat-proof-bot@users.noreply.github.com"
          git add proofs/rosendaltown-*.json proofs/rosendaltown-*.md proofs/solobid-v2-*.json proofs/solobid-v2-*.md proofs/diketo-*.json proofs/diketo-*.md
          git commit -m "proof: verify real Rosendaltown, SoloBid-v2, and Diketo work"
          git push
